<!doctype html>
<html lang="vi">
  <body style="margin:0;background:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7ff;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(37,99,235,.10);">
            <tr>
              <td style="background:linear-gradient(135deg,#2563eb,#1d4ed8);padding:28px 32px;">
                <span style="color:#ffffff;font-size:22px;font-weight:800;letter-spacing:-.02em;">Splitz</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 8px;font-size:20px;color:#0f172a;font-weight:800;">Mã xác thực đăng nhập</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#475569;">
                  Nhập mã bên dưới vào ứng dụng Splitz để hoàn tất đăng nhập. Mã có hiệu lực trong 60 phút.
                </p>
                <div style="text-align:center;margin:0 0 24px;">
                  <span style="display:inline-block;background:#eff6ff;color:#1d4ed8;font-size:32px;font-weight:800;letter-spacing:.35em;padding:16px 24px;border-radius:14px;">{{ .Token }}</span>
                </div>
                <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">
                  Nếu bạn không yêu cầu mã này, hãy bỏ qua email. Tuyệt đối không chia sẻ mã cho bất kỳ ai.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;background:#f8fafc;border-top:1px solid #eef2f7;">
                <p style="margin:0;font-size:12px;color:#94a3b8;">Splitz · Chia tiền nhóm sòng phẳng</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
