# Cấu hình nginx cho Splitz SPA + PWA (nạp vào /etc/nginx/conf.d/default.conf).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: route sâu (/settings, /g/abc) không 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Asset có hash trong tên file → cache vĩnh viễn.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Những file này ĐỔI theo từng lần container khởi động hoặc từng bản deploy
  # → phải luôn qua mạng, không được cache:
  #   - runtime-config.js: entrypoint sinh lại từ biến môi trường container.
  #   - sw.js / registerSW.js / push-sw.js: nếu cache, service worker kẹt bản cũ.
  #   - index.html: tham chiếu asset hash mới sau mỗi bản deploy.
  #   - manifest.webmanifest: có thể đổi nội dung giữa các bản.
  location = /runtime-config.js { add_header Cache-Control "no-cache"; }
  location = /sw.js              { add_header Cache-Control "no-cache"; }
  location = /registerSW.js      { add_header Cache-Control "no-cache"; }
  location = /push-sw.js         { add_header Cache-Control "no-cache"; }
  location = /index.html         { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # Icon có thể đổi giữa các bản deploy → để trình duyệt tự hỏi ETag.
  location /icons/ {
    add_header Cache-Control "public, max-age=3600";
  }

  # Nén mọi text-ish — HTML/JS/CSS là phần lớn payload của SPA.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Header an toàn cơ bản (đủ cho một static SPA; không CSP vì app cần nối
  # Supabase/PostHog/Google Fonts tuỳ cấu hình từng host).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
